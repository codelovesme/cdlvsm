name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry-run: builds, sanity-checks, and uploads an Actions artifact but
  # does NOT create a GitHub Release (guarded by `if: github.ref_type == 'tag'`
  # below), so packaging can be exercised without cutting a real tag.
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build release tarball (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Determine version string
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Single source of truth for the shipped version is the git tag: stamp
      # Cargo.toml's [package] version from it before building so the binary's
      # `--version` always matches the release, rather than trusting a
      # hand-edited Cargo.toml to have been bumped. Only the leading-`v`-
      # stripped tag (v0.2.0 -> 0.2.0) is a valid semver for Cargo.
      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v="${{ github.ref_name }}"
          v="${v#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          grep -m1 '^version = ' Cargo.toml

      - name: Build release
        run: cargo build --release

      - name: Sanity check — binary runs standalone
        run: |
          set -euo pipefail
          target/release/cdlvsm --version
          target/release/cdlvsm --help >/dev/null

      - name: Package tarball
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          stage="cdlvsm-${v}-x86_64-linux"
          mkdir -p "$stage"
          cp target/release/cdlvsm "$stage/cdlvsm"
          cp LICENSE README.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          echo "Built:"
          ls -1 ./*.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdlvsm-release-${{ steps.version.outputs.version }}
          path: "*.tar.gz"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
